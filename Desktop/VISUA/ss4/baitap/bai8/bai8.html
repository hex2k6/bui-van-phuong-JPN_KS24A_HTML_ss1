<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <h1>Biểu Mẫu Đặt Hàng</h1>
        <label for="product">Sản Phẩm: </label>
        <input type="text" id="product"><br>
        <label for="quantity">số lượng: </label>
        <input type="number" id="quantity" min="1" max="1000">
        <h2>Thông Tin Liên Hệ:</h2>
        <label for="name">Tên:</label>
        <input type="text" id="name"><br>
        <label for="email">Email:</label>
        <input type="text" id="email"><br>
        <label for="adderss">Địa chỉ:</label>
        <textarea name="adderss" id="adderss" cols="20" rows="5"></textarea><br>
        <button><strong>Đặt Hàng</strong></button>
    </form>
</body>
</html>
