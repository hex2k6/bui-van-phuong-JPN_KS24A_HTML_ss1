<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!-- các thuộc tính trong bảng 
 border : tạo đường viền cho bảng
 cellpadding: khoảng cách từ viền của ô đến của nội dung
 cellspacing: khoảng cách từ viền của bảng đến viền của ô
    thuộc tính của thẻ 
    align:
  -->
<body>
    <table border="1" cellpadding="5" cellspacing="5"> 
        <caption>thẻ sinh vien</caption>
        <thead>
            <tr>
                <td>stt</td>
                <th>ten</th>
                <td>tuoi</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>bui van a</td>
                <td>10</td>
            </tr>
            <tr>
                <td>2</td>
                <td>le chung c</td>
                <td>10</td>
            </tr>
            <tr>
                <td>3</td>
                <td>nguyen van b</td>
                <td>10</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">tổng số sinh viên</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
